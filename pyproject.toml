[project]
name = "docchat-rag"
version = "0.1.0"
description = "Document chat RAG backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "python-multipart==0.0.33",
  "anthropic==2.6.0",
  "httpx==0.28.1",
  "langgraph==1.2.20",
  "chromadb==1.5.9",
  "sentence-transformers==6.2.0",
  "rank-bm25==0.2.2",
  "pypdf==7.0.0",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "pandas==3.1.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.4", "httpx==0.28.1"]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-root = "src/backend"
module-name = "app"

[tool.pytest.ini_options]
pythonpath = ["src/backend"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
extend-exclude = ["src/backend/app/utilities", "src/backend/app/routers"]
