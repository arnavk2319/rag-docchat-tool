# fly.toml app configuration file generated for rag-docchat-tool on 2026-11-09T18:18:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rag-docchat-tool'
primary_region = 'ord'

[build]
[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
